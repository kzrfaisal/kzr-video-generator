<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">KZR Creator Studio interface preview</title>
  <desc id="desc">A preview of the local project library with navigation, filters, and a button to start a new AI-generated video.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8fc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f8fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#101828" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1440" height="900" rx="28" fill="url(#page)"/>
  <rect x="22" y="22" width="1396" height="856" rx="23" fill="#fff" filter="url(#shadow)"/>

  <rect x="22" y="22" width="234" height="856" rx="23" fill="#111827"/>
  <rect x="234" y="22" width="22" height="856" fill="#111827"/>
  <path d="M60 67v31m1-15 20-16m-20 16 20 16" fill="none" stroke="#8cf3c6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m72 76 14 8-14 8Z" fill="#8cf3c6"/>
  <text x="101" y="78" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="750">KZR</text>
  <text x="101" y="99" fill="#98a2b3" font-family="Inter,Arial,sans-serif" font-size="13">Creator Studio</text>

  <text x="56" y="154" fill="#667085" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">WORKSPACE</text>
  <rect x="42" y="177" width="192" height="48" rx="12" fill="#233044"/>
  <rect x="58" y="191" width="20" height="16" rx="4" fill="none" stroke="#8cf3c6" stroke-width="2"/>
  <path d="M58 195h8l3-3h9" fill="none" stroke="#8cf3c6" stroke-width="2"/>
  <text x="94" y="207" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="650">Projects</text>
  <path d="M59 254h20M59 262h20M59 270h20" stroke="#98a2b3" stroke-width="2" stroke-linecap="round"/>
  <text x="94" y="267" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="15">Logs</text>

  <circle cx="59" cy="817" r="5" fill="#34d399"/>
  <text x="74" y="819" fill="#e5e7eb" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600">Local workspace</text>
  <text x="56" y="841" fill="#667085" font-family="Inter,Arial,sans-serif" font-size="11">Private on this computer</text>

  <text x="310" y="92" fill="#667085" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">CREATIVE WORKSPACE</text>
  <text x="310" y="140" fill="#101828" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="760">Your projects</text>
  <text x="310" y="172" fill="#667085" font-family="Inter,Arial,sans-serif" font-size="16">Continue creating, review a draft, or start something new.</text>

  <rect x="914" y="85" width="236" height="46" rx="14" fill="#f2f4f7"/>
  <circle cx="940" cy="108" r="7" fill="none" stroke="#667085" stroke-width="2"/>
  <path d="m945 113 6 6" stroke="#667085" stroke-width="2" stroke-linecap="round"/>
  <text x="965" y="114" fill="#98a2b3" font-family="Inter,Arial,sans-serif" font-size="14">Search projects…</text>
  <rect x="1168" y="85" width="50" height="46" rx="14" fill="#f2f4f7"/>
  <circle cx="1193" cy="108" r="8" fill="none" stroke="#667085" stroke-width="2"/>
  <rect x="1236" y="85" width="150" height="46" rx="14" fill="#111827"/>
  <path d="M1260 101v15m-7-7h15" stroke="#8cf3c6" stroke-width="2.4" stroke-linecap="round"/>
  <text x="1281" y="114" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650">New video</text>

  <line x1="310" y1="211" x2="1386" y2="211" stroke="#e4e7ec"/>
  <rect x="310" y="239" width="82" height="34" rx="17" fill="#111827"/>
  <text x="335" y="261" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="650">All</text>
  <circle cx="374" cy="256" r="10" fill="#344054"/>
  <text x="371" y="260" fill="#d0d5dd" font-family="Inter,Arial,sans-serif" font-size="11">0</text>
  <text x="423" y="261" fill="#667085" font-family="Inter,Arial,sans-serif" font-size="13">Drafts  0</text>
  <text x="510" y="261" fill="#667085" font-family="Inter,Arial,sans-serif" font-size="13">Generating  0</text>
  <text x="630" y="261" fill="#667085" font-family="Inter,Arial,sans-serif" font-size="13">Ready  0</text>
  <text x="1317" y="261" fill="#667085" font-family="Inter,Arial,sans-serif" font-size="12">Grid view</text>

  <rect x="310" y="310" width="334" height="250" rx="22" fill="url(#card)" stroke="#d0d5dd" stroke-width="2" stroke-dasharray="7 7"/>
  <circle cx="477" cy="387" r="31" fill="#e8fff5"/>
  <path d="M477 374v26m-13-13h26" stroke="#057a55" stroke-width="3" stroke-linecap="round"/>
  <text x="396" y="452" fill="#101828" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">Start a new video</text>
  <text x="356" y="484" fill="#667085" font-family="Inter,Arial,sans-serif" font-size="14">Turn one idea into a finished video</text>
  <text x="379" y="505" fill="#667085" font-family="Inter,Arial,sans-serif" font-size="14">and ready-to-share reels.</text>

  <rect x="690" y="310" width="334" height="250" rx="22" fill="#f9fafb"/>
  <rect x="1070" y="310" width="316" height="250" rx="22" fill="#f9fafb"/>
  <rect x="690" y="310" width="334" height="122" rx="22" fill="#edfdf7"/>
  <rect x="1070" y="310" width="316" height="122" rx="22" fill="#f0f4ff"/>
  <text x="720" y="476" fill="#98a2b3" font-family="Inter,Arial,sans-serif" font-size="14">Projects appear here as you create.</text>
  <text x="1100" y="476" fill="#98a2b3" font-family="Inter,Arial,sans-serif" font-size="14">Review, resume, and download.</text>

  <rect x="310" y="624" width="1076" height="184" rx="24" fill="#111827"/>
  <circle cx="368" cy="681" r="24" fill="#8cf3c6"/>
  <path d="m362 669 19 12-19 12Z" fill="#111827"/>
  <text x="408" y="676" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="720">From one idea to a complete video pack</text>
  <text x="408" y="709" fill="#98a2b3" font-family="Inter,Arial,sans-serif" font-size="15">Plan, edit, narrate, render, and prepare social clips in one local workflow.</text>
  <rect x="408" y="741" width="112" height="34" rx="17" fill="#233044"/>
  <text x="431" y="763" fill="#8cf3c6" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="650">NEXT.JS</text>
  <rect x="532" y="741" width="122" height="34" rx="17" fill="#233044"/>
  <text x="554" y="763" fill="#8cf3c6" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="650">TYPESCRIPT</text>
  <rect x="666" y="741" width="106" height="34" rx="17" fill="#233044"/>
  <text x="691" y="763" fill="#8cf3c6" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="650">FFMPEG</text>
</svg>
